    function authorHtml(a) {
      let s = a.me ? "<b>" + a.n + "</b>" : a.n;
      if (a.eq) s += '<span class="pub-equal tooltip" data-tooltip="Equal contribution">=</span>';
      if (a.corr) s += '<span class="pub-corr tooltip" data-tooltip="Corresponding author">C</span>';
      return s;
    }

    function typeLabel(t) {
      return t === "journal" ? "Journal Article" : t === "preprint" ? "Preprint" : "Patent";
    }

    function statusBadge(p) {
      if (!p.status) return "";
      const cls = p.status === "accepted" ? "pub-status accepted" : "pub-status";
      const label = p.status === "accepted" ? "Accepted" : "Under Review";
      return '<span class="' + cls + '">' + label + "</span>";
    }

    function badges(p) {
      let out = "";
      if (p.doi) out += '<a class="badge" target="_blank" rel="noopener" href="https://doi.org/' + p.doi + '">DOI</a>';
      if (p.url) out += '<a class="badge" target="_blank" rel="noopener" href="' + p.url + '">URL</a>';
      return out;
    }

    function renderItem(p) {
      const authorsLine = p.authors.map(authorHtml).join(", ");
      return (
        '<div class="pub-item" data-num="' + p.num + '" data-type="' + p.type + '" data-year="' + (p.year || "") + '">' +
        '<div><span class="pub-num">' + p.num + ".</span>" + statusBadge(p) + "</div>" +
        '<div class="pub-authors">' + authorsLine + "</div>" +
        '<div class="pub-title">' + p.title + "</div>" +
        '<div class="pub-venue"><i>' + p.venue + "</i>, <b>" + p.venueYear + "</b></div>" +
        (badges(p) ? '<div class="pub-badges">' + badges(p) + "</div>" : "") +
        "</div>"
      );
    }

    function init() {
      const list = document.getElementById("pub-list");
      const countEl = document.getElementById("pub-count");
      const emptyEl = document.getElementById("pub-empty");
      const searchEl = document.getElementById("pub-search");
      const typeEl = document.getElementById("pub-type");
      const dateEl = document.getElementById("pub-date");

      const sorted = PUBS.slice().sort((a, b) => b.num - a.num);
      list.innerHTML = sorted.map(renderItem).join("");

      const years = Array.from(new Set(PUBS.map((p) => p.year).filter(Boolean))).sort((a, b) => b - a);
      years.forEach((y) => {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = y;
        dateEl.appendChild(opt);
      });
      const reviewOpt = document.createElement("option");
      reviewOpt.value = "review";
      reviewOpt.textContent = "Under review / in press";
      dateEl.appendChild(reviewOpt);

      const items = Array.from(list.querySelectorAll(".pub-item"));
      const byNum = {};
      PUBS.forEach((p) => (byNum[p.num] = p));

      function applyFilters() {
        const q = searchEl.value.trim().toLowerCase();
        const type = typeEl.value;
        const date = dateEl.value;
        let visible = 0;
        items.forEach((el) => {
          const p = byNum[el.dataset.num];
          const haystack = (p.title + " " + p.venue + " " + p.authors.map((a) => a.n).join(" ")).toLowerCase();
          let ok = true;
          if (q && haystack.indexOf(q) === -1) ok = false;
          if (type && p.type !== type) ok = false;
          if (date) {
            if (date === "review") {
              if (p.year) ok = false;
            } else if (String(p.year) !== date) {
              ok = false;
            }
          }
          el.classList.toggle("hidden", !ok);
          if (ok) visible++;
        });
        countEl.textContent = visible + " of " + items.length + " publications";
        emptyEl.style.display = visible === 0 ? "block" : "none";
      }

      searchEl.addEventListener("input", applyFilters);
      typeEl.addEventListener("change", applyFilters);
      dateEl.addEventListener("change", applyFilters);
      const params = new URLSearchParams(window.location.search);
      const q = params.get("q");
      if (q) searchEl.value = q;
      applyFilters();
    }

    init();
